# Paikallinen PostgreSQL. Käynnistä: SPRING_PROFILES_ACTIVE=postgres
# Ilman profiilia sovellus käyttää application.properties-tiedoston H2-muistitietokantaa.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketguru}
spring.datasource.username=${DB_USERNAME:ticketguru}
spring.datasource.password=${DB_PASSWORD:ticketguru}
spring.datasource.driver-class-name=org.postgresql.Driver

# Todellisella kannalla Hibernate ei luo tauluja, ellei tätä aseteta.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false
